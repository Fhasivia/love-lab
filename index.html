R:{n:'Regalos',lab:'Muestra tangible',d:'Tu muestra registra el objeto pensado: un detalle prueba que existes en la mente de alguien.',t:'Elige un detalle pequeño y pensado para alguien y entrégalo en persona, no por chat.'},
T:{n:'Tiempo de calidad',lab:'Incubación',d:'Tu muestra necesita incubación: atención completa, sin interferencias ni pantallas.',t:'Aparta 30 minutos con alguien, sin celular, solo para escucharle.'},

{q:'El robot celebró la partida. ¿Qué celebración te haría sentir que ganaste de verdad?',o:{V:'Que me diga “lo hiciste increíble”',S:'Que recoja los bolos por mí',R:'Que me entregue un premio',T:'Que juguemos otra ronda juntos',C:'Chocar las manos'}},
{q:'Cinco ofertas llegan al laboratorio. ¿Cuál firmarías?',o:{V:'La que te dice lo que necesitas oír',S:'La que se encarga de tus tareas',R:'La que te sorprende con regalos',T:'La que siempre tiene tiempo para ti',C:'La que te abraza al llegar'}},
{q:'Entre los archivos, ¿qué pérdida te costaría más resistir?',o:{V:'Dejar de recibir palabras de aprecio',S:'Que otros dejen de ayudarme',R:'Dejar de recibir detalles',T:'Perder el tiempo compartido',C:'Perder el contacto físico'}},

{d:60,l:['…señal int…ervenida… ¿me escuchas?','Funciona. Funciona demasiado bien.','Celebra cuando gano, pero no siente nada.','Si el afecto es perfecto… ¿puede ser real?']},

{d:50,l:['Esto no estaba en el plan.','Las personas dejaron de buscarse entre ellas.','Encuentra los archivos. Lo que les pasó puede pasarte.','Usa la luz violeta.']},
{d:60,l:['Esta es mi bitácora final.','Yo no pude decidir. Por eso te llamé.','Apagar la red o mantenerla.','El amor real exige esfuerzo y mirarse a los ojos. Decide.']}];

 K.style.setProperty('--led',{reposo:'#b58cff33',inicio:'#b58cff55',video:'#ff4fa344',interaccion:AC[cur-1]+'77',respuesta:AC[cur-1]+'44'}[s]||'#ffffff55');F[s]();idle();fp()}

reposo(){st.innerHTML=rob(0)+'<h2>Tome asiento</h2><p class="ins">El sensor de presencia inicia el turno.</p>';btn('Simular sensor · me senté',()=>go('inicio'));hint('Reposo · luz tenue')},

function match(items,tgs,fill,done){const box=document.createElement('div');box.className='grid';const c1=document.createElement('div'),c2=document.createElement('div');c1.className=c2.className='col';box.append(c1,c2);let sel=null,fails=0,ok=0;
 const shint=()=>{$$('.tg.hint').forEach(x=>x.classList.remove('hint'));if(sel&&fails>=5)box.querySelector(`.tg[data-i="${sel.dataset.i}"]`).classList.add('hint')};
 const pick=b=>{if(b.disabled)return;sel&&sel.classList.remove('sel');sel=b;b.classList.add('sel');shint()};
 const tryM=t=>{if(!sel||t.classList.contains('ok'))return;if(sel.dataset.i===t.dataset.i){bp(700);sel.classList.replace('sel','ok');sel.disabled=true;t.classList.remove('hint');t.classList.add('ok');if(fill)t.innerHTML=`<b>${+t.dataset.i+1}</b> ${sel.dataset.l}`;sel=null;if(++ok===items.length)tm(done,600)}
  else{bp(180,.2);t.classList.remove('no');void t.offsetWidth;t.classList.add('no');fails++;sel.classList.remove('sel');hint('Intentos fallidos: '+fails+(fails>=5?' · mira la pista':' / 5'));sel=null}};
 items.forEach(it=>{const b=document.createElement('button');b.className='it';b.innerHTML=it.h;b.dataset.i=it.i;b.dataset.l=it.l||'';let sx,sy,mv=0;
  b.onclick=()=>pick(b);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;mv=0;pick(b)};
  b.onpointermove=e=>{if(!b.hasPointerCapture(e.pointerId))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)mv=1;if(mv){b.style.transform=`translate(${dx}px,${dy}px)`;b.style.zIndex=3}};
  b.onpointerup=b.onpointercancel=e=>{b.style.transform='';b.style.zIndex='';if(mv&&e.type==='pointerup'){b.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tg');b.style.pointerEvents='';if(t)tryM(t)}};c1.append(b)});
 tgs.forEach(t=>{const d=document.createElement('div');d.className='tg';d.dataset.i=t.i;d.innerHTML=t.h;d.onclick=()=>tryM(d);c2.append(d)});hint('Arrastra o toca un elemento y luego su destino · reintentos ilimitados');return box}
const CB=[['#ff4fa3','●','rosa'],['#5aa0ff','▲','azul'],['#ffd24f','■','amarillo'],['#5aff9a','◆','verde'],['#ff9a4f','★','naranja']];
G[0]=()=>{game('Creación del Prototipo','Conecta los cables para darle energía a tu robot.');const s=c=>`<b style="color:${c[0]};font-size:28px">${c[1]}</b>`;
 $('#gm').append(match(rnd(CB.map((c,i)=>({i,h:s(c)+' Cable '+c[2]}))),CB.map((c,i)=>({i,h:s(c)+' Puerto '+(i+1)})),0,()=>{bp(880,.5);K.style.setProperty('--led','#ff4fa3cc');fin(rob(1)+'<br>El robot abre los ojos y te sostiene la mirada.')}))};
G[1]=()=>{game('Experimentación','Desliza la bola para empezar la partida.');let n=0,sc=0,busy=0;const PP=[[200,60],[188,72],[212,72],[176,84],[200,84],[224,84]];
 $('#gm').innerHTML=`<div style="width:100%"><svg class="lane" id="ln" viewBox="0 0 400 290" aria-label="Pista de bolos"><path d="M185 40L20 285H380L215 40z" fill="#12102a" stroke="#4a4a8a"/><g id="pn"></g><g id="ba" style="transform-box:fill-box;transform-origin:center"><circle cx="200" cy="250" r="18" fill="#ff86c4"/><path d="M200 222v-14M192 214l8-8 8 8" stroke="#fff" stroke-width="3" fill="none"/></g></svg><div class="mu" id="sc">Lanzamiento 0/3</div><button class="b" id="tb">Lanzar recto</button></div>`;
 const rp=()=>$('#pn').innerHTML=PP.map(p=>`<g class="pin"><ellipse cx="${p[0]}" cy="${p[1]}" rx="5" ry="9" fill="#ffc4e2"/><circle cx="${p[0]}" cy="${p[1]-10}" r="4" fill="#ffc4e2"/></g>`).join('');rp();
 const th=dx=>{if(busy||n>=3)return;busy=1;bp(300,.3);const a=Math.max(-110,Math.min(110,dx)),b=$('#ba');b.style.transition='transform .8s ease-in';b.style.transform=`translate(${a*.5}px,-170px) scale(.4)`;
  tm(()=>{const k=Math.round(6-Math.min(4,Math.abs(a)/28));$$('.pin').slice(0,k).forEach(p=>{p.style.opacity=0;p.style.transform=`translate(${(Math.random()-.5)*60}px,-14px) rotate(${(Math.random()-.5)*160}deg)`});sc+=k;n++;bp(120,.25);$('#sc').textContent=`Lanzamiento ${n}/3 · ${sc} bolos`;
   tm(()=>{b.style.transition='none';b.style.transform='';rp();busy=0;if(n>=3)fin(rob(1)+'<br>El robot celebra con entusiasmo dulce y mecánico: “¡Pleno! Lo hemos conseguido juntos.” ¿Lo siente… o lo programaron?')},1000)},850)};
 const s=$('#ln');let x0,y0;s.onpointerdown=e=>{s.setPointerCapture(e.pointerId);x0=e.clientX;y0=e.clientY};s.onpointerup=e=>{const dx=e.clientX-x0,dy=e.clientY-y0;if(dy<-30||Math.hypot(dx,dy)<10)th(dx)};$('#tb').onclick=()=>th(0);hint('Desliza hacia arriba o toca “Lanzar recto” · 3 lanzamientos')};
G[2]=()=>{game('Comercialización','Ordena las tarjetas desde el taller hasta la fábrica.');const D=['Taller del científico','Prueba piloto','Ronda de inversión','Lanzamiento global','Producción en masa'];
 $('#gm').append(match(rnd(D.map((d,i)=>({i,h:d,l:d}))),D.map((d,i)=>({i,h:'<b>'+(i+1)+'</b>'})),1,()=>{bp(660);fin('Cinco empresarios llegan con sus ofertas:<div class="chips"><span>Afirma Corp.</span><span>ServiBot</span><span>Regalix</span><span>TiempoPlus</span><span>AbrazoTech</span></div>')}))};
G[3]=()=>{game('Los Errores','Pasa la luz por los archivos y descubre qué ocurrió.');
 const FL=[['#0142','“Mi hijo habla más con el robot que conmigo.”',22,32],['#0187','“Dejó de contestarme. Ya no me necesita.”',72,55],['#0203','“No puedo dormir sin él. ¿Me está observando?”',36,82]];
 /* id propio (#fxa): antes chocaba con el checkbox #fx y la linterna no seguía el dedo */
 $('#gm').innerHTML=`<div class="fx" id="fxa"><div class="lens" id="le"></div>${FL.map((f,i)=>`<button class="fl" data-i="${i}" style="left:${f[2]}%;top:${f[3]}%">▒▒▒ ${f[0]}</button>`).join('')}</div>`;
 const rd=new Set(),fx=$('#fxa'),le=$('#le');const mv=e=>{const r=fx.getBoundingClientRect();le.style.left=e.clientX-r.left+'px';le.style.top=e.clientY-r.top+'px';$$('.fl').forEach(b=>{const q=b.getBoundingClientRect();b.classList.toggle('lit',Math.hypot(q.left+q.width/2-e.clientX,q.top+q.height/2-e.clientY)<90)})};fx.onpointermove=mv;fx.onpointerdown=mv;
 $$('.fl').forEach(b=>b.onclick=()=>{const f=FL[b.dataset.i];rd.add(b.dataset.i);b.classList.add('rd');b.textContent=f[0]+' '+f[1];
  /* mantiene la tarjeta abierta dentro del área, también en pantallas estrechas */
  const W=fx.clientWidth,H=fx.clientHeight,w=b.offsetWidth,h=b.offsetHeight;b.style.left=Math.min(W-w/2-6,Math.max(w/2+6,f[2]/100*W))+'px';b.style.top=Math.min(H-h/2-6,Math.max(h/2+6,f[3]/100*H))+'px';
  bp(600);$('#res').textContent='Archivos leídos: '+rd.size+'/3';if(rd.size===3)fin('Evidencia completa: los usuarios no querían apagarlos.')});hint('Mueve la luz violeta · toca un archivo para abrirlo')};
G[4]=()=>{game('La Decisión','Mantén pulsado el botón que quieres elegir.');let dn=0;
 $('#gm').innerHTML='<div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;width:100%"><button class="hb a" data-d="on">Mantener la red<i></i></button><button class="hb r" data-d="off">Desactivar robots<i></i></button></div>';hint('Mantén 2 s para confirmar · esta acción no puede deshacerse');
 $$('.hb').forEach(b=>{let t0=0,raf;const bar=b.querySelector('i');const stop=()=>{cancelAnimationFrame(raf);t0=0;bar.style.transition='width .3s';bar.style.width=0};
  const run=()=>{if(!t0)return;const p=Math.min(1,(Date.now()-t0)/2000);bar.style.width=p*100+'%';if(p<1)return raf=requestAnimationFrame(run);t0=0;dn=1;S.dec=b.dataset.d;if(!S.cn){S.cn=1;const c=cn();c[S.dec]++;setcn(c)}save();bp(440,.5);K.style.setProperty('--led',S.dec==='off'?'#ff5a6eaa':'#5aa0ffaa');fin('Decisión registrada.');fp()};
  const start=()=>{if(dn||t0)return;t0=Date.now();bar.style.transition='none';run()};
  b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);start()};b.onpointerup=b.onpointercancel=stop;b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start()}};b.onkeyup=stop})};
/* diagnóstico */
function diag(){const dec=S.dec||'on',off=dec==='off';st.innerHTML=`<h2>${off?'Robots desactivados':'La red continúa'}</h2><p class="ins">${off?'Las luces del sector se apagan una por una.':'La red sigue encendida. Alguien te escucha.'}</p>`;say(off?'Las luces se apagan una por una.':'La red sigue encendida.');
 tm(()=>{const c={V:0,S:0,R:0,T:0,C:0};Object.values(S.a).forEach(k=>c[k]++);const n=Object.values(S.a).length,m=Math.max(...Object.values(c)),dom=Object.keys(c).filter(k=>c[k]===m),all=n===5&&m===1;
  const ti=n===0?'Sin datos suficientes para el diagnóstico':all?'Hablas todos los lenguajes por igual':'Compuesto dominante: '+dom.map(k=>L[k].lab+' · '+L[k].n).join(' + ');
  const ds=n===0?'Faltaron respuestas en el recorrido.':all?'Tu muestra reacciona a los cinco reactivos con la misma intensidad.':dom.map(k=>L[k].d).join(' ');
  const ta=n===0||all?'Esta semana pregunta a alguien cómo le gusta que lo cuiden. Escucha sin interrumpir.':dom.map(k=>L[k].t).join(' ');
  const q=cn();st.innerHTML=`<h2 style="font-size:24px">${ti}</h2><p class="ins" style="font-size:17px">${ds}</p><div class="dg">${Object.keys(c).map(k=>`<div><b>${L[k].lab}</b><span class="tk"><i style="width:${c[k]*20}%"></i></span> ${c[k]}</div>`).join('')}</div>
  <p class="ins" style="font-size:17px"><b>Tarea de la semana:</b> ${ta}</p>${off?'':`<div class="pass" style="text-align:left;font-size:14px">FICHA · ROBOT IDEAL LL-${all||!n?'ALL':dom.join('')}<br>Calibrado para: ${all||!n?'todos los reactivos':dom.map(k=>L[k].n).join(' + ')}<br>Advertencia: no sustituye a personas reales.</div>`}<div class="qr" id="qr"></div>
  <p class="mu">Resultado lúdico con 5 datos, no una prueba psicométrica. · Decisiones hoy: desactivar ${q.off} · mantener ${q.on}</p>`;
  try{const o=qrcode(0,'L');o.addData(`LOVELAB|${S.id}|${all?'ALL':dom.join('+')}|${dec}`);o.make();$('#qr').innerHTML=o.createSvgTag({scale:3,margin:1})}catch(e){$('#qr').textContent=S.id}
  btn('Finalizar y reiniciar',()=>{newPass();go('reposo')});hint('Escanea el QR para llevarte tu ficha')},3500)}

function fp(){const q=cn();$('#fi').innerHTML=`<b>Pase</b> ${S.id} · <b>Estado</b> ${state} · <b>Respuestas</b> ${Object.entries(S.a).map(e=>e[0]+':'+e[1]).join(' ')||'—'} · <b>Decisión</b> ${S.dec||'—'} · <b>Hoy</b> desactivar ${q.off} / mantener ${q.on}`}
$('#fb').onclick=()=>$('#fa').hidden=!$('#fa').hidden;
$('#f1').onclick=()=>{newPass();go('reposo')};$('#f3').onclick=()=>go('inicio');

$('#sel').innerHTML=[1,2,3,4,5].map(i=>`<button data-r="${i}" aria-label="Registro ${i}">${i}</button>`).join('');
$$('#sel button').forEach(b=>b.onclick=()=>{cur=+b.dataset.r;delete S.dec;S.cn=0;save();go('reposo')});
try{S=JSON.parse(localStorage[LS])}catch(e){}
if(S&&S.id){cur=Math.min(5,S.cur||1)}else newPass();
